                return "translate(" + [d.x, d.y] + ")rotate(" + d.rotate + ")";
              })
              .text(function(d) { return d.text; })
              .on("click", function(d) { window.open(d.url, '_blank'); })
              .append("title")
              .text(function(d) { return d.text + " (" + d.count + " papers)"; });
        }
    </script>
</body>
</html>
